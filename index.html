<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T3'Adana Yarışma Dünyası</title><link rel="stylesheet" href="style.css"></head><body><div class="w"><div class="lg"><img src="logo-ttt.png" alt="Türkiye Teknoloji Takımı"><img src="logo-festival.png" alt="2. Yeşilay Bağımsız Aile Festivali"></div><div id="app"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script><script src="common.js"></script>
<script>
const A=$('app'),SOC=`<a class=soc href="https://www.instagram.com/t3adana/" target=_blank rel=noopener><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="#fff"/></svg></i><span>Bizi takip et<br><b>@t3adana</b></span></a>`;let pin,pid,me,G,sig,S;
function joinView(){A.innerHTML=`<h1>T3'Adana<br>Yarışma Dünyası</h1><div class=c><input id=p placeholder="Oyun PIN" inputmode=numeric><input id=n placeholder="Ad Soyad *"><input id=e type=email placeholder="E-posta (isteğe bağlı)"><button onclick=join()>Katıl</button><div class=sm id=m></div></div>${SOC}`;
 $('p').value=new URLSearchParams(location.search).get('pin')||''}
async function join(){pin=$('p').value.trim();const n=$('n').value.trim(),e=$('e').value.trim();
 if(!pin||!n){$('m').textContent='PIN ve Ad Soyad zorunludur.';return}
 const r=db.ref('games/'+pin),s=await r.once('value');
 if(!s.exists()){$('m').textContent='Oyun bulunamadı.';return}
 const old=localStorage['pid'+pin],ex=old&&s.child('players/'+old).exists();
 if(s.val().state!='lobby'&&!ex){$('m').textContent='Yarışma başladı, artık odaya katılamazsın.';return}
 pid=ex?old:(localStorage['pid'+pin]=r.child('players').push().key);me=ex?s.child('players/'+old+'/n').val():n;
 if(!ex)await r.child('players/'+pid).set({n,e,s:0});
 r.on('value',x=>{G=x.val();draw()});setInterval(tick,200)}
function draw(){
 if(!G){A.innerHTML='<div class=c><h2>Oyun sona erdi.</h2></div>';return}
 const rk=rank(G.players),i=rk.findIndex(x=>x.id==pid),mp=(G.players||{})[pid]||{s:0},st=G.state,q=(G.qs||[])[G.qi],a=((G.ans||{})[G.qi]||{})[pid];
 const sg=st+G.qi+!!a+rk.map(x=>x.id+x.s).join();if(sg==sig)return;sig=sg;
 let h=`<div class="c hd"><span>${esc(me||mp.n)}</span><span>${mp.s||0} puan • ${i+1}. sıra</span></div>`;
 if(st=='lobby')h+=`<div class=c><h1>Bekleniyor…</h1><div class=sm>${esc(G.title||"")}</div><div class=sm>Yönetici oyunu başlatınca sorular gelecek.<br>${rk.length} yarışmacı odada</div></div>${SOC}`;
 else if(st=='q')h+=`<div class=c><div class=sm>Soru ${G.qi+1}/${G.qs.length}</div><div class=big id=t></div><h2>${esc(q.t)}</h2></div>`+(a?`<div class=c><h2>✔ Cevabın alındı, bekle…</h2></div>`:`<div class=g>${q.o.map((o,j)=>`<button class="o o${j}" onclick=ans(${j})>${'▲◆●■'[j]} ${esc(o)}</button>`).join('')}</div>`);
 else if(st=='r'){const ok=a&&a.a==q.c,p=(G.pts||{})[pid]||0;h+=`<div class=c><h1 class=${ok?'ok':'no'}>${ok?'✔ Doğru! +'+p:a?'✖ Yanlış':'Süre doldu'}</h1><div class=sm>Doğru cevap: ${esc(q.o[q.c])}</div></div>`+board(rk,pid)}
 else{h+=`<div class=c><h1>Yarışma bitti!</h1><div class=big>${i+1}. sıra</div></div>`+board(rk,pid)+`<div class=c><canvas id=cv width=1080 height=1920 style="width:100%;max-width:300px;display:block;margin:auto;border-radius:12px"></canvas><button onclick="shareImg(S)">Hikâye olarak paylaş</button><button onclick="dl()" style="background:#fff">Görseli indir / kaydet</button></div>`}
 A.innerHTML=h;
 if(st=='end')logosReady().then(()=>{S=story(me||mp.n,i+1,mp.s||0,rk.length);const cv=$('cv');if(cv)cv.getContext('2d').drawImage(S,0,0)})
 tick()}
function dl(){saveImg(S)}
function ans(j){const q=G.qs[G.qi];if(now()>G.qStart+q.d*1000)return;
 db.ref(`games/${pin}/ans/${G.qi}/${pid}`).set({a:j,t:firebase.database.ServerValue.TIMESTAMP})}
function tick(){const t=$('t');if(!t||!G||G.state!='q')return;
 t.textContent='⏱ '+Math.max(0,Math.ceil((G.qStart+G.qs[G.qi].d*1000-now())/1000))}
joinView();
</script></body></html>
